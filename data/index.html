<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Button</title><link rel="stylesheet" href="/style.css"></head><body>
<header><span class="dot"></span><div><h1>Red Button</h1><small id="subtitle">Device console</small></div></header><main>
<section><h2>Status</h2><div id="status" class="grid"></div></section>
<section><h2>Device</h2><label>Device name<input id="name" maxlength="32"></label></section>
<section><h2>Buttons</h2>
  <div class="row"><button id="addButton" class="secondary" type="button">+ Add button</button></div>
  <div id="buttonList"></div>
  <div class="row"><button id="save" type="button">Save all buttons</button></div>
  <p id="actionResult"></p>
</section>
<section><h2>Wi-Fi</h2><button id="scan" class="secondary">Scan networks</button><label>SSID<select id="ssid"><option value="">Select or scan…</option></select></label><label>Manual SSID (hidden networks)<input id="ssidManual" maxlength="32" placeholder="Leave empty to use selection above"></label><label>Password<input id="password" type="password" maxlength="63" autocomplete="new-password"></label><div class="row"><button id="saveWifi">Save & reboot</button><button id="forgetWifi" class="danger">Forget Wi-Fi</button></div><p id="wifiResult"></p></section>
<section><h2>Firmware update</h2>
  <p class="note">Current version: <b id="fwCurrent">-</b></p>
  <div class="row"><button id="checkUpdate" class="secondary" type="button">Check for updates</button><button id="installUpdate" type="button" hidden>Install update</button></div>
  <p id="updateStatus" class="note"></p>
  <progress id="updateProgress" max="100" value="0" hidden></progress>
  <p class="note">Or upload a local firmware.bin:</p>
  <label>Firmware .bin<input id="firmware" type="file" accept=".bin"></label><progress id="progress" max="100" value="0"></progress><button id="upload">Upload firmware</button><p id="otaResult"></p>
</section>
<section><h2>System</h2><label>Import non-secret config<input id="importFile" type="file" accept="application/json,.json"></label><div class="row"><button id="import" class="secondary">Import config</button><button id="export" class="secondary">Export config</button><button id="reboot" class="secondary">Reboot</button><button id="reset" class="danger">Factory reset</button></div><p id="systemResult" class="note">Factory reset requires explicit confirmation.</p></section>
</main><footer>Red Button firmware · local operation, no cloud</footer><script src="/app.js"></script></body></html>
